<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bandeja Padel Rackets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a court-blue top bar, a calm grid of racket cards, one view at a time (shop / racket / basket / checkout) */
:root {
  --bg: #f3f6fa;
  --surface: #ffffff;
  --fg: #12233b;
  --muted: #5a6a80;
  --line: #dbe3ee;
  --court: #1d4f91;
  --court-ink: #ffffff;
  --ball: #d9f24a;
  --ball-ink: #1b2a06;
  --good: #1f7a4d;
  --warn: #9a6a00;
  --chip-new: #e2f0e8;
  --chip-used: #f6eedb;
  --art-bg: #e7edf5;
  --font-display: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1726; --surface: #14223a; --fg: #e8eef7; --muted: #9aabc3; --line: #253754;
  --court: #2a64b3; --court-ink: #ffffff; --ball: #d9f24a; --ball-ink: #1b2a06;
  --good: #5cc890; --warn: #e2b44a; --chip-new: #173a2b; --chip-used: #3a3019; --art-bg: #1a2c48;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1726; --surface: #14223a; --fg: #e8eef7; --muted: #9aabc3; --line: #253754;
  --court: #2a64b3; --court-ink: #ffffff; --ball: #d9f24a; --ball-ink: #1b2a06;
  --good: #5cc890; --warn: #e2b44a; --chip-new: #173a2b; --chip-used: #3a3019; --art-bg: #1a2c48;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--court); }
:root[data-theme="dark"] a { color: #8fb8ee; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) a { color: #8fb8ee; } }
:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--court); color: var(--court-ink); }
.topbar-inner { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--court-ink); }
.brand svg { flex: none; }
.brand-name { font: 800 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.basket-btn { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1.5px solid rgba(255,255,255,.55); color: var(--court-ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.basket-btn:hover { border-color: #fff; }
.count { background: var(--ball); color: var(--ball-ink); border-radius: 999px; min-width: 22px; height: 22px; padding: 0 6px; display: inline-grid; place-items: center; font: 600 12px var(--font-mono); }

main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }

.intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.intro h1 { font: 800 clamp(34px, 6vw, 52px)/0.95 var(--font-display); text-transform: uppercase; margin: 0 0 6px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 52ch; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.filter[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.card-link { display: flex; flex-direction: column; color: inherit; text-decoration: none; flex: 1; }
.card-link:hover .art { background: color-mix(in srgb, var(--art-bg) 80%, var(--court) 8%); }
.art { background: var(--art-bg); aspect-ratio: 4 / 5; max-width: 100%; display: grid; place-items: center; transition: background .2s; }
.art svg { width: 62%; height: auto; }
.card-body { padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card-name { font-weight: 700; font-size: 16px; line-height: 1.3; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 6px; }
.price { font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.new { background: var(--chip-new); color: var(--good); }
.chip.used { background: var(--chip-used); color: var(--warn); }
.card-foot { padding: 8px 16px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.yt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; }
.yt:hover { text-decoration: underline; }
.sold-tag { font-size: 12px; color: var(--muted); }

.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--ball); color: var(--ball-ink); }
.btn-primary:hover { filter: brightness(.96); }
.btn-dark { background: var(--fg); color: var(--bg); }
.btn-ghost { background: transparent; border: 1.5px solid var(--line); }
.btn[disabled] { opacity: .55; cursor: default; }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-weight: 600; margin-bottom: 16px; }
.back:hover { color: var(--fg); }

.detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .detail { grid-template-columns: 1fr; gap: 20px; } }
.gallery-main { background: var(--art-bg); border-radius: 16px; aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; }
.gallery-main svg { width: 58%; height: auto; max-height: 90%; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
.thumb { background: var(--art-bg); border: 2px solid transparent; border-radius: 10px; aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; cursor: pointer; padding: 6px; }
.thumb svg { width: 70%; height: auto; max-height: 90%; }
.thumb[aria-current="true"] { border-color: var(--court); }
.thumb-label { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }
.detail h1 { font: 800 clamp(32px, 5vw, 44px)/1 var(--font-display); text-transform: uppercase; margin: 6px 0 10px; text-wrap: balance; }
.detail .price { font-size: 28px; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 20px 0; padding: 16px 0; border-block: 1px solid var(--line); }
.specs dt { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.specs dd { margin: 0; font-weight: 500; }
.notes { color: var(--fg); max-width: 60ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.page-title { font: 800 clamp(30px, 5vw, 42px)/1 var(--font-display); text-transform: uppercase; margin: 0 0 18px; }
.basket-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .basket-layout { grid-template-columns: 1fr; } }
.line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line .mini { background: var(--art-bg); border-radius: 8px; aspect-ratio: 1/1; display: grid; place-items: center; }
.line .mini svg { width: 60%; height: auto; }
.line-name { font-weight: 700; }
.remove { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
.sumrow { display: flex; justify-content: space-between; padding: 6px 0; font-variant-numeric: tabular-nums; }
.sumrow.total { font-weight: 700; font-size: 18px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }

form .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
form label { font-weight: 600; font-size: 14px; }
form input, form textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
form input:focus, form textarea:focus { border-color: var(--court); outline: none; }
.hint { font-size: 13px; color: var(--muted); }
.error { color: #c0392b; font-size: 13px; }
:root[data-theme="dark"] .error { color: #ff8a7a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .error { color: #ff8a7a; } }
.radio-group { display: grid; gap: 8px; }
.radio { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.radio input { accent-color: var(--court); }

.mbway { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); margin-bottom: 16px; }
.mbway-badge { font: 800 15px var(--font-display); letter-spacing: .04em; background: #d6002a; color: #fff; border-radius: 6px; padding: 3px 8px; }

.pay-box { background: var(--court); color: var(--court-ink); border-radius: 14px; padding: 22px; margin: 16px 0; }
.pay-box .big { font: 500 clamp(26px, 6vw, 36px) var(--font-mono); font-variant-numeric: tabular-nums; }
.pay-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 14px; }
.pay-grid .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.pay-grid .val { font: 500 20px var(--font-mono); word-break: break-word; }
.copy { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; margin-top: 4px; }
.steps { padding-left: 20px; margin: 0; display: grid; gap: 6px; }
.notice { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 16px 0; }
footer { border-top: 1px solid var(--line); max-width: 1120px; margin: 0 auto; padding: 18px 16px 30px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.sell-btn { background: var(--ball); color: var(--ball-ink); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-main img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.line .mini img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.seller { font-size: 13px; color: var(--muted); }
.seller b { color: var(--fg); font-weight: 600; }
.sell-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .sell-layout { grid-template-columns: 1fr; } }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .two { grid-template-columns: 1fr; } }
form select { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.previews { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.previews img { aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; width: 100%; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 4px; accent-color: var(--court); }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.code { font: 500 22px var(--font-mono); letter-spacing: .08em; background: var(--bg); border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 14px; display: inline-block; }
.mine { display: grid; gap: 8px; }
.mine-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mine-row:last-child { border-bottom: 0; }
details.owner { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
details.owner summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.inline-form input { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; flex: 1; min-width: 0; }
.pay-box h2 { font: 800 22px var(--font-display); text-transform: uppercase; margin: 0 0 8px; }
.pay-box .btn-primary { margin-top: 16px; display: inline-block; text-decoration: none; }
.status { color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<style>body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#shop" aria-label="Bandeja, back to all rackets">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#d9f24a"/><path d="M4 11c5 3 17 3 22 0M4 19c5-3 17-3 22 0" stroke="#1b2a06" stroke-width="1.6" fill="none"/></svg>
      <span class="brand-name">Bandeja</span>
    </a>
    <div class="top-actions">
      <button class="sell-btn" id="sellBtn" type="button">Sell a racket</button>
      <button class="basket-btn" id="basketBtn" type="button">Basket <span class="count" id="count">0</span></button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <span>Padel rackets, new and used. Payment by MB WAY.</span>
  <span id="footContact"></span>
</footer>

<div class="toast" id="toast" hidden></div>

<script>
/* ============================================================
   SHOP SETTINGS — edit these
   ============================================================ */
const SHOP = {
  name: "Bandeja",
  mbwayNumber: "912 345 678",        // your MB WAY phone number (shown to buyers)
  whatsapp: "351912345678",          // same number with country code, digits only
  shipping: [
    { id: "pickup", label: "Pick up in person", price: 0 },
    { id: "ctt",    label: "Shipping in Portugal (CTT)", price: 6 }
  ]
};

/* Database for listings from other sellers (see supabase-setup.sql).
   Leave empty to switch "Sell a racket" off. The publishable/anon key is meant to be public. */
const SUPABASE = {
  url: "https://llyqlkdndiupwvczjenj.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxseXFsa2RuZGl1cHd2Y3pqZW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzI2MDAsImV4cCI6MjEwNjk0ODYwMH0.D7RfoSlTDL2MRhK9QPf4ho_rAqFE9JzK1m6C77TF0vQ"
};

/* Your own rackets. condition: "New" | "Like new" | "Very good" | "Good" | "Fair"
   shape: "round" | "teardrop" | "diamond". colors draw the placeholder pictures
   until you add real photos (put image files in the repo and list them in photos). */
const RACKETS = [
  { id: "vertex04", name: "Bullpadel Vertex 04 2024", condition: "Very good", price: 145,
    shape: "diamond", weight: "365 g", core: "MultiEVA (hard)", face: "Carbon 12K", year: 2024,
    notes: "Played about 3 months. Small scuff on the frame guard, face is clean. Comes with original cover.",
    review: "https://www.youtube.com/results?search_query=Bullpadel+Vertex+04+2024+review",
    colors: ["#111827", "#f97316", "#facc15"] },
  { id: "viper24", name: "Babolat Technical Viper 2024", condition: "New", price: 249,
    shape: "diamond", weight: "365 g", core: "Black EVA (hard)", face: "Carbon 12K", year: 2024,
    notes: "Brand new, still in plastic. Full manufacturer warranty.",
    review: "https://www.youtube.com/results?search_query=Babolat+Technical+Viper+2024+review",
    colors: ["#0b0b0b", "#e11d48", "#f5f5f5"] },
  { id: "at10", name: "Nox AT10 Genius 18K 2024", condition: "Like new", price: 189,
    shape: "teardrop", weight: "370 g", core: "MLD Black EVA", face: "Carbon 18K", year: 2024,
    notes: "Used twice, then I switched to a round racket. No marks.",
    review: "https://www.youtube.com/results?search_query=Nox+AT10+Genius+18K+2024+review",
    colors: ["#1e293b", "#eab308", "#ffffff"] },
  { id: "extreme", name: "Head Extreme Pro 2024", condition: "Good", price: 95,
    shape: "teardrop", weight: "360 g", core: "Power Foam", face: "Carbon", year: 2024,
    notes: "One season of club play. Normal wear on the edges, grip recently replaced.",
    review: "https://www.youtube.com/results?search_query=Head+Extreme+Pro+2024+padel+review",
    colors: ["#0f172a", "#22d3ee", "#a3e635"] },
  { id: "ml10", name: "Nox ML10 Pro Cup", condition: "Good", price: 79,
    shape: "round", weight: "360 g", core: "HR3 Black EVA (soft)", face: "Fibreglass", year: 2023,
    notes: "A forgiving control racket, good for beginners. Light marks on the face.",
    review: "https://www.youtube.com/results?search_query=Nox+ML10+Pro+Cup+review",
    colors: ["#111111", "#dc2626", "#fbbf24"] },
  { id: "metalbone", name: "Adidas Metalbone 3.3", condition: "Fair", price: 110,
    shape: "diamond", weight: "370 g", core: "EVA High Memory", face: "Carbon Aluminized 16K", year: 2024,
    notes: "Played hard for a season. Visible chips on the frame top, structurally fine. Priced for that.",
    review: "https://www.youtube.com/results?search_query=Adidas+Metalbone+3.3+review",
    colors: ["#1f2937", "#3b82f6", "#e5e7eb"] }
];
/* ============================================================ */

const ONLINE = !!(SUPABASE.url && SUPABASE.key);
const CONDITIONS = ["New", "Like new", "Very good", "Good", "Fair"];
const CONDITION_INFO = {
  "New": "Unused, in original packaging.",
  "Like new": "Used once or twice, no visible marks.",
  "Very good": "Light use, minor cosmetic marks.",
  "Good": "Regular use, normal wear on frame and face.",
  "Fair": "Heavy use, visible marks, plays fine."
};
const PALETTES = [["#111827","#f97316","#facc15"],["#0f172a","#22d3ee","#a3e635"],["#1f2937","#3b82f6","#e5e7eb"],["#111111","#dc2626","#fbbf24"],["#1e293b","#a855f7","#f5f5f5"]];

const euro = n => "€" + Number(n).toFixed(2).replace(".", ",");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtPhone = p => p.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3");
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : "";
const safeYouTube = u => /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u || "") ? u : "";

const SHOP_SELLER = { key: "shop", name: SHOP.name, mbway: SHOP.mbwayNumber, whatsapp: SHOP.whatsapp, shop: true };
let ITEMS = RACKETS.map(r => ({ ...r, photos: r.photos || [], seller: SHOP_SELLER, remote: false }));
let listingsState = ONLINE ? "loading" : "off";
const byId = id => ITEMS.find(r => r.id === id);

/* ---------- database calls ---------- */
const H = () => ({ apikey: SUPABASE.key, Authorization: "Bearer " + SUPABASE.key });
async function api(path, opts = {}) {
  const res = await fetch(SUPABASE.url + path, { ...opts, headers: { ...H(), ...(opts.headers || {}) } });
  if (!res.ok) {
    let msg = res.status + "";
    try { const j = await res.json(); msg = j.message || j.error || msg; } catch (e) {}
    throw new Error(msg);
  }
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}
const photoUrl = p => `${SUPABASE.url}/storage/v1/object/public/photos/${encodeURIComponent(p)}`;

function fromRow(row) {
  const pal = PALETTES[parseInt(row.id.slice(0, 2), 16) % PALETTES.length];
  return {
    id: "u" + row.id, uuid: row.id, remote: true,
    name: row.name, condition: row.condition, price: Number(row.price),
    shape: row.shape || "teardrop", shapeKnown: !!row.shape, weight: row.weight || "", notes: row.notes || "",
    review: safeYouTube(row.review), colors: pal,
    photos: (row.photos || []).filter(p => /^[a-z0-9-]+\.jpg$/.test(p)).map(photoUrl),
    seller: { key: "s:" + row.seller_phone, name: row.seller_name, mbway: fmtPhone(row.seller_phone), whatsapp: "351" + row.seller_phone }
  };
}

async function loadListings() {
  if (!ONLINE) return;
  try {
    const rows = await api("/rest/v1/listings?select=id,created_at,name,condition,price,shape,weight,notes,review,photos,seller_name,seller_phone&order=created_at.desc&limit=500");

  } catch (e) {

  }
  basket = basket.filter(byId); saveBasket();
  render(false);
}

const HEADS = {

  teardrop: "M100,16 C156,16 182,52 182,98 C182,150 142,194 100,206 C58,194 18,150 18,98 C18,52 44,16 100,16Z",
  diamond:  "M100,12 C142,12 178,42 182,82 C186,126 142,184 100,208 C58,184 14,126 18,82 C22,42 58,12 100,12Z"

let svgSeq = 0;
function racketSVG(r, view = "front") {
  const [frame, accent, light] = r.colors;
  const head = HEADS[r.shape] || HEADS.teardrop;
  const uid = "c" + (svgSeq++);
  const grip = x => [0,1,2,3,4,5].map(i => `<path d="M${x},${254+i*9} L${200-x},${259+i*9}" stroke="${light}" stroke-opacity=".35" stroke-width="2"/>`).join("");
  if (view === "side") {
    return `<svg viewBox="0 0 200 320" role="img" aria-label="${esc(r.name)}, side view">
      <path d="M93,14 C99,12 101,12 107,14 L109,200 L104,250 L96,250 L91,200Z" fill="${frame}"/>
      <rect x="95.5" y="14" width="9" height="186" fill="${accent}" opacity=".85"/>
      <rect x="91" y="248" width="18" height="62" rx="5" fill="${frame}"/>${grip(91)}</svg>`;
  }
  let holes = "";
  for (let y = 46; y < 196; y += 15) for (let x = 34; x < 170; x += 15) {
    holes += `<circle cx="${x + (((y - 46) / 15) % 2 ? 7 : 0)}" cy="${y}" r="3.6"/>`;
  }
  const faceArt = view === "back"
    ? `<path d="M10,150 L100,90 L190,150 L190,175 L100,115 L10,175Z" fill="${accent}"/>
       <path d="M10,190 L100,130 L190,190 L190,202 L100,142 L10,202Z" fill="${light}" opacity=".9"/>`
    : `<path d="M-10,80 L210,20 L210,62 L-10,122Z" fill="${accent}"/>
       <path d="M-10,128 L210,68 L210,78 L-10,138Z" fill="${light}" opacity=".9"/>
       <circle cx="100" cy="160" r="16" fill="none" stroke="${light}" stroke-width="3" opacity=".8"/>`;
  const vb = view === "detail" ? "34 20 132 132" : "0 0 200 320";
  return `<svg viewBox="${vb}" role="img" aria-label="${esc(r.name)}, ${view} view">
    <defs><clipPath id="${uid}"><path d="${head}"/></clipPath></defs>
    <path d="M80,190 L94,250 L106,250 L120,190 L112,190 L100,226 L88,190Z" fill="${frame}"/>
    <g clip-path="url(#${uid})"><rect width="200" height="220" fill="${frame}"/>${faceArt}<g fill="${frame}" opacity=".9">${holes}</g></g>
    <path d="${head}" fill="none" stroke="${frame}" stroke-width="9"/>
    <path d="${head}" fill="none" stroke="${accent}" stroke-width="2" opacity=".7"/>
    <rect x="88" y="248" width="24" height="62" rx="6" fill="${frame}"/>${grip(88)}</svg>`;
}
const VIEWS = [["front","Front"],["back","Back"],["side","Side"],["detail","Close-up"]];

/* ---------- small helpers ---------- */
function store(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function put(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

let basket = store("bandeja-basket", []);
let myListings = store("bandeja-my-listings", []);   // [{id, code, name}]
function saveBasket() { put("bandeja-basket", basket); document.getElementById("count").textContent = basket.length; }
function addToBasket(id) { if (!basket.includes(id)) basket.push(id); saveBasket(); toast("Added to basket"); }
function removeFromBasket(id) { basket = basket.filter(x => x !== id); saveBasket(); }

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
}
function copyText(txt, label) {
  try { navigator.clipboard.writeText(txt).then(() => toast(label + " copied"), () => toast("Select the text to copy it")); }
  catch (e) { toast("Select the text to copy it"); }
}

function shrink(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1400, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("photo could not be read")), "image/jpeg", 0.82);
    };
    img.onerror = () => reject(new Error("photo could not be read"));
    img.src = URL.createObjectURL(file);
  });
}

/* ----- basket and checkout ----- */
function groups() {
  const map = new Map();
  basket.map(byId).filter(Boolean).forEach(r => {
    if (!map.has(r.seller.key)) map.set(r.seller.key, { seller: r.seller, items: [] });
    map.get(r.seller.key).items.push(r);
  });
  return [...map.values()].map(g => {
    const sub = g.items.reduce((s, r) => s + r.price, 0);
    const ship = g.seller.shop ? (SHOP.shipping.find(s => s.id === checkout.delivery) || SHOP.shipping[0]).price : 0;
    return { ...g, sub, ship, total: sub + ship };
  });
}

          ${gs.map(g => `<div class="sumrow"><span>${esc(g.seller.name)}${g.ship ? " (incl. delivery)" : ""}</span><span>${euro(g.total)}</span></div>`).join("")}
          <div class="sumrow total"><span>Total</span><span class="price">${euro(total)}</span></div>
          ${gs.length > 1 ? `<p class="hint">You'll pay each seller separately.</p>` : ""}
          <div class="mbway" style="margin-top:14px"><span class="mbway-badge">MB WAY</span><span class="meta">Payment by MB WAY only</span></div>
          <p class="error" id="formError" hidden></p>
          <button class="btn btn-primary" type="submit" style="width:100%">Place order and pay with MB WAY</button>
        </form>
      </div>
    </div>`;
  document.getElementById("back").onclick = () => go("shop");
  app.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { removeFromBasket(b.dataset.remove); viewBasket(); });
  const form = document.getElementById("checkoutForm");
  form.querySelectorAll('input[name="delivery"]').forEach(i => i.onchange = () => { readForm(); viewBasket(); });
  form.onsubmit = e => {
    e.preventDefault(); readForm();
    const err = document.getElementById("formError");
    const digits = checkout.phone.replace(/\D/g, "").replace(/^351/, "");
    let msg = "";
    if (!checkout.name.trim()) msg = "Enter your name.";
    else if (!/^9[1236]\d{7}$/.test(digits)) msg = "Enter a Portuguese mobile number with 9 digits, starting with 91, 92, 93 or 96.";
    else if (hasShop && checkout.delivery !== "pickup" && !checkout.address.trim()) msg = "Enter a shipping address, or choose pick up.";
    if (msg) { err.textContent = msg; err.hidden = false; return; }
    placeOrder(digits, hasShop);
  };
}

function readForm() {
  const g = id => document.getElementById(id);
  const d = document.querySelector('input[name="delivery"]:checked');
  checkout = { delivery: d ? d.value : checkout.delivery, name: g("cname").value, phone: g("cphone").value,
               address: g("caddr") ? g("caddr").value : "" };
}

function placeOrder(phoneDigits) {
  const ref = "BJ-" + Math.floor(1000 + Math.random() * 9000);
  const delivery = SHOP.shipping.find(s => s.id === checkout.delivery);
  order = { ref, groups: groups().map(g => ({ ...g, text: [
    `New order ${ref}`,
    ...g.items.map(r => `- ${r.name} (${r.condition}) ${euro(r.price)}`),
    g.seller.shop ? `Delivery: ${delivery.label}${delivery.price ? " " + euro(delivery.price) : ""}` : "Delivery: to arrange with you",
    `Total: ${euro(g.total)}`,
    `Name: ${checkout.name.trim()}`,
    `MB WAY phone: ${phoneDigits}`,
    g.seller.shop && checkout.delivery !== "pickup" ? `Address: ${checkout.address.trim()}` : ""
  ].filter(Boolean).join("\n") })) };
  basket = []; saveBasket();
  go("order");
}

function viewOrder() {
  if (!order) return go("shop");
  const many = order.groups.length > 1;
  app.innerHTML = `
    <h1 class="page-title">Order ${esc(order.ref)}</h1>
    ${many ? `<p class="status" style="margin-top:-8px">Your basket has rackets from ${order.groups.length} sellers. Pay each one separately.</p>` : ""}
    <div class="basket-layout">
      <div>
        ${order.groups.map((g, i) => `
        <div class="pay-box">
          <span class="mbway-badge" style="display:inline-block;margin-bottom:10px">MB WAY</span>
          <h2>Pay ${esc(g.seller.name)}</h2>
          <div>${esc(g.items.map(r => r.name).join(", "))}</div>
          <div class="big">${euro(g.total)}</div>
          <div class="pay-grid">
            <div><div class="label">To number</div><div class="val">${esc(g.seller.mbway)}</div><button class="copy" type="button" data-copy="${esc(g.seller.mbway.replace(/\s/g,""))}" data-label="Number">Copy number</button></div>
            <div><div class="label">Message / reference</div><div class="val">${esc(order.ref)}</div><button class="copy" type="button" data-copy="${esc(order.ref)}" data-label="Reference">Copy reference</button></div>
          </div>
          <a class="btn btn-primary" href="https://wa.me/${esc(g.seller.whatsapp)}?text=${encodeURIComponent(g.text)}" target="_blank" rel="noopener">Send order to ${esc(g.seller.name)} on WhatsApp</a>
          <button class="copy" type="button" data-copy="${esc(g.text)}" data-label="Order details" style="margin-left:8px">Copy order details</button>
        </div>`).join("")}
      </div>
      <div class="panel">
        <div style="font-weight:700;margin-bottom:8px">What happens next</div>
        <ol class="steps">
          <li>Open the MB WAY app and choose <b>Send money</b>.</li>
          <li>Send each amount to the number shown, with <b>${esc(order.ref)}</b> in the message.</li>
          <li>Send your order on WhatsApp so the seller can match your payment.</li>
          <li>The seller confirms once the payment arrives, then you arrange pick-up or shipping.</li>
        </ol>
      </div>
    </div>`;
  app.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copyText(b.dataset.copy, b.dataset.label));
}

/* ---------- routing ---------- */
function go(where) { if (location.hash === "#" + where) render(); else location.hash = where; }
function render(scroll = true) {
  const h = location.hash.slice(1);
  if (scroll) window.scrollTo(0, 0);
  if (h.startsWith("r-") && byId(h.slice(2))) viewRacket(byId(h.slice(2)));
  else if (h.startsWith("r-u") && listingsState === "loading") app.innerHTML = `<p class="status">Loading racket…</p>`;
  else if (h === "basket") viewBasket();
  else if (h === "order") viewOrder();
  else if (h === "sell") viewSell();
  else viewShop();
}
window.addEventListener("hashchange", () => render());
document.getElementById("basketBtn").onclick = () => go("basket");
document.getElementById("sellBtn").onclick = () => { sellResult = null; go("sell"); };
document.getElementById("footContact").textContent = "Shop MB WAY: " + SHOP.mbwayNumber;
document.getElementById("count").textContent = basket.length;
render();
loadListings();
</script>
</body>
</html>
