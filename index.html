<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Padeleiros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a court-blue top bar, a calm grid of racket cards, one view at a time (shop / racket / seller / sell / account) */
/* Palette: ink black and court green. --bar is the top bar, --court the dark panels, --ball the green action colour. */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --fg: #131614;
  --muted: #626a64;
  --line: #dfe4e0;
  --bar: #0a0c0b;
  --court: #141816;
  --court-ink: #ffffff;
  --ball: #15803d;
  --ball-ink: #ffffff;
  --link: #13723a;
  --good: #1f7a4d;
  --warn: #9a6a00;
  --chip-new: #e3f1e8;
  --chip-used: #f7ece0;
  --art-bg: #e9ece9;
  --font-display: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0d0c; --surface: #161917; --fg: #eef2ef; --muted: #9ba39d; --line: #283029;
  --bar: #000000; --court: #1d2320; --court-ink: #ffffff; --ball: #22c55e; --ball-ink: #04210f; --link: #4ade80;
  --good: #5cc890; --warn: #e2b44a; --chip-new: #173a2b; --chip-used: #3a2a19; --art-bg: #1f2421;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0d0c; --surface: #161917; --fg: #eef2ef; --muted: #9ba39d; --line: #283029;
  --bar: #000000; --court: #1d2320; --court-ink: #ffffff; --ball: #22c55e; --ball-ink: #04210f; --link: #4ade80;
  --good: #5cc890; --warn: #e2b44a; --chip-new: #173a2b; --chip-used: #3a2a19; --art-bg: #1f2421;
  color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font-body); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--ball); outline-offset: 2px; }

.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); color: var(--court-ink); border-bottom: 3px solid var(--ball); }
.topbar-inner { max-width: 1120px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--court-ink); }
.brand svg { flex: none; }
.brand-name { font: 800 26px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.basket-btn { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 1.5px solid rgba(255,255,255,.55); color: var(--court-ink); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.basket-btn:hover { border-color: #fff; }
.count { background: var(--ball); color: var(--ball-ink); border-radius: 999px; min-width: 22px; height: 22px; padding: 0 6px; display: inline-grid; place-items: center; font: 600 12px var(--font-mono); }

main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 64px; }

.intro { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.intro h1 { font: 800 clamp(34px, 6vw, 52px)/0.95 var(--font-display); text-transform: uppercase; margin: 0 0 6px; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); max-width: 52ch; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filter { border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.filter[aria-pressed="true"] { background: var(--ball); color: var(--ball-ink); border-color: var(--ball); }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.card-link { display: flex; flex-direction: column; color: inherit; text-decoration: none; flex: 1; }
.card-link:hover .art { background: color-mix(in srgb, var(--art-bg) 92%, var(--ball) 8%); }
.art { background: var(--art-bg); aspect-ratio: 4 / 5; max-width: 100%; display: grid; place-items: center; transition: background .2s; }
.art { position: relative; overflow: hidden; }
.art-slide { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .12s; }
.art-slide.on { opacity: 1; }
.art-slide svg { width: 62%; height: auto; }
.art-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
.art-dots { position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; gap: 5px; pointer-events: none; }
.art-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(0,0,0,.22); }
.art-dots span.on { background: var(--ball); }
.card-body { padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card-name { font-weight: 700; font-size: 16px; line-height: 1.3; margin: 0; }
.meta { color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: auto; padding-top: 6px; }
.price { font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.chip.new { background: var(--chip-new); color: var(--good); }
.chip.used { background: var(--chip-used); color: var(--warn); }
.card-foot { padding: 8px 16px 14px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.yt { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; text-decoration: none; }
.yt:hover { text-decoration: underline; }
.sold-tag { font-size: 12px; color: var(--muted); }

.btn { border: 0; border-radius: 10px; padding: 12px 18px; font-weight: 700; cursor: pointer; }
.btn-primary { background: var(--ball); color: var(--ball-ink); }
.btn-primary:hover { filter: brightness(.96); }
.btn-dark { background: var(--fg); color: var(--bg); }
.btn-ghost { background: transparent; border: 1.5px solid var(--line); }
.btn[disabled] { opacity: .55; cursor: default; }
.back { background: none; border: 0; padding: 0; color: var(--muted); cursor: pointer; font-weight: 600; margin-bottom: 16px; }
.back:hover { color: var(--fg); }

.detail { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 32px; align-items: start; }
@media (max-width: 760px) { .detail { grid-template-columns: minmax(0, 1fr); gap: 20px; } }
.gallery-main { background: var(--art-bg); border-radius: 16px; aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; }
.gallery-main svg { width: 58%; height: auto; max-height: 90%; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
.thumb { background: var(--art-bg); border: 2px solid transparent; border-radius: 10px; aspect-ratio: 1 / 1; max-width: 100%; display: grid; place-items: center; cursor: pointer; padding: 6px; }
.thumb svg { width: 70%; height: auto; max-height: 90%; }
.thumb[aria-current="true"] { border-color: var(--ball); }
.thumb-label { font-size: 12px; color: var(--muted); text-align: center; margin-top: 4px; }
.detail h1 { font: 800 clamp(32px, 5vw, 44px)/1 var(--font-display); text-transform: uppercase; margin: 6px 0 10px; text-wrap: balance; }
.detail .price { font-size: 28px; }
.specs { display: grid; grid-template-columns: auto 1fr; gap: 8px 18px; margin: 20px 0; padding: 16px 0; border-block: 1px solid var(--line); }
.specs dt { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
.specs dd { margin: 0; font-weight: 500; }
.notes { color: var(--fg); max-width: 60ch; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.page-title { font: 800 clamp(30px, 5vw, 42px)/1 var(--font-display); text-transform: uppercase; margin: 0 0 18px; }
.basket-layout { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .basket-layout { grid-template-columns: minmax(0, 1fr); } }
.line { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line .mini { background: var(--art-bg); border-radius: 8px; aspect-ratio: 1/1; display: grid; place-items: center; }
.line .mini svg { width: 60%; height: auto; }
.line-name { font-weight: 700; }
.remove { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0; text-decoration: underline; }
.sumrow { display: flex; justify-content: space-between; padding: 6px 0; font-variant-numeric: tabular-nums; }
.sumrow.total { font-weight: 700; font-size: 18px; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }

form .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
form label { font-weight: 600; font-size: 14px; }
form input, form textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
form input:focus, form textarea:focus, form select:focus { border-color: var(--ball); outline: none; }
.hint { font-size: 13px; color: var(--muted); }
.error { color: #c0392b; font-size: 13px; }
:root[data-theme="dark"] .error { color: #ff8a7a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .error { color: #ff8a7a; } }
.radio-group { display: grid; gap: 8px; }
.radio { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.radio input { accent-color: var(--ball); }

.mbway { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); margin-bottom: 16px; }
.mbway-badge { font: 800 15px var(--font-display); letter-spacing: .04em; background: #d6002a; color: #fff; border-radius: 6px; padding: 3px 8px; }

.pay-box { background: var(--court); color: var(--court-ink); border-radius: 14px; padding: 22px; margin: 16px 0; }
.pay-box .big { font: 500 clamp(26px, 6vw, 36px) var(--font-mono); font-variant-numeric: tabular-nums; }
.pay-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 14px; }
.pay-grid .label { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; opacity: .8; }
.pay-grid .val { font: 500 20px var(--font-mono); word-break: break-word; }
.copy { background: rgba(255,255,255,.16); border: 0; color: #fff; border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; margin-top: 4px; }
.steps { padding-left: 20px; margin: 0; display: grid; gap: 6px; }
.notice { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 16px 0; }
footer { border-top: 1px solid var(--line); max-width: 1120px; margin: 0 auto; padding: 18px 16px 30px; color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; }
.top-actions { display: flex; gap: 8px; align-items: center; }
.sell-btn { background: var(--ball); color: var(--ball-ink); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
.gallery-main img { width: 100%; height: 100%; object-fit: contain; border-radius: 16px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 6px; }
.line .mini img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
.seller { font-size: 13px; color: var(--muted); }
.seller b { color: var(--fg); font-weight: 600; }
.sell-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 760px) { .sell-layout { grid-template-columns: minmax(0, 1fr); } }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) {
  .two { grid-template-columns: minmax(0, 1fr); }
  .brand-name { font-size: 22px; }
  .top-actions { gap: 6px; }
  .sell-btn, .basket-btn { padding: 6px 10px; font-size: 13px; }
}
form input, form select, form textarea { width: 100%; min-width: 0; }
form .radio input, form .check input { width: auto; }
form select { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
.previews { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.previews { margin-bottom: 4px; }
.previews:empty { display: none; }
.pic { position: relative; }
.pic img { aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; width: 100%; display: block; }
.pic-x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
.pic-x:hover { background: var(--ball); }
.pic-tag { position: absolute; left: 4px; bottom: 4px; background: var(--ball); color: var(--ball-ink); font-size: 11px; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
.add-photos { align-self: flex-start; cursor: pointer; }
.check { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.check:has(input:checked) { border-color: var(--ball); }
form .check input { flex: none; width: 22px; height: 22px; margin: 0; accent-color: var(--ball); cursor: pointer; }
.hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
.code { font: 500 22px var(--font-mono); letter-spacing: .08em; background: var(--bg); border: 1.5px dashed var(--line); border-radius: 10px; padding: 10px 14px; display: inline-block; }
.mine { display: grid; gap: 8px; }
.mine-row { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.mine-row:last-child { border-bottom: 0; }
details.owner { margin-top: 28px; border-top: 1px solid var(--line); padding-top: 14px; }
details.owner summary { cursor: pointer; color: var(--muted); font-weight: 600; font-size: 14px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.inline-form input { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; flex: 1; min-width: 0; }
.pay-box h2 { font: 800 22px var(--font-display); text-transform: uppercase; margin: 0 0 8px; }
.pay-box .btn-primary { margin-top: 16px; display: inline-block; text-decoration: none; }
.status { color: var(--muted); font-size: 14px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.place-filter { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 6px 0 14px; color: var(--muted); }
.place-filter select { border: 0; background: transparent; padding: 7px 4px; font-weight: 600; font-size: 14px; color: var(--fg); max-width: 220px; }
.place { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.place.big { font-size: 15px; margin-top: 6px; }
.test-tag { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--link); }
.test-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--ball); color: var(--fg); font-size: 14px; }
.test-line svg { color: var(--ball); }
.check-soft { margin-bottom: 14px; }
.contact-box { margin-top: 22px; padding: 18px; border-radius: 14px; background: var(--court); color: var(--court-ink); display: grid; gap: 10px; }
.contact-box p { margin: 0; }
.contact-box .hint { color: var(--court-ink); opacity: .8; }
.contact-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.wa-btn { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.phone-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.phone { font: 500 18px var(--font-mono); font-variant-numeric: tabular-nums; }
.contact-box .btn-ghost { border-color: rgba(255,255,255,.5); color: var(--court-ink); }
.stars { color: #e0a100; letter-spacing: 1px; white-space: nowrap; }
.stars-off { color: var(--line); }
.mini-star { color: #b98400; font-weight: 600; }
:root[data-theme="dark"] .mini-star { color: #e8b84a; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .mini-star { color: #e8b84a; } }
.seller-link { font-size: 13px; font-weight: 600; color: var(--fg); text-decoration: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seller-link:hover { text-decoration: underline; }
.avatar { flex: none; width: 64px; height: 64px; border-radius: 50%; background: var(--ball); color: var(--ball-ink); display: grid; place-items: center; font: 800 28px var(--font-display); }
.avatar.sm { width: 40px; height: 40px; font-size: 18px; }
.seller-box { display: flex; align-items: center; gap: 12px; margin-top: 18px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); text-decoration: none; }
a.seller-box:hover { border-color: var(--ball); }
.seller-box .chev { margin-left: auto; font-size: 24px; color: var(--muted); }
.sold-banner { display: inline-block; background: var(--fg); color: var(--bg); font-weight: 700; border-radius: 8px; padding: 4px 10px; margin: 12px 0 0; }
.profile-head { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 8px; }
.profile-head h1 { font: 800 clamp(30px, 5vw, 42px)/1 var(--font-display); text-transform: uppercase; margin: 0 0 4px; overflow-wrap: anywhere; }
.profile-head .btn { margin-left: auto; }
.profile-stats { margin-top: 6px; }
.section-title { font: 800 24px var(--font-display); text-transform: uppercase; margin: 32px 0 12px; display: flex; gap: 10px; align-items: baseline; }
.reviews { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.review { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; }
.review p { margin: 0; }
.review-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.panel-title { font-weight: 700; margin-bottom: 6px; }
.row-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.mine-row { flex-wrap: wrap; }
.sold-form, .review-form { display: grid; gap: 8px; padding: 12px 0 16px; border-bottom: 1px solid var(--line); }
.sold-form label, .field-label { font-weight: 600; font-size: 14px; }
.at-input { display: flex; align-items: center; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding-left: 12px; }
.at-input span { color: var(--muted); font-weight: 600; }
.at-input input { border: 0 !important; background: transparent !important; padding-left: 4px !important; flex: 1; min-width: 0; }
.at-input:focus-within { border-color: var(--ball); }
.unit-input { display: flex; align-items: center; border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding-right: 12px; }
.unit-input input { border: 0 !important; background: transparent !important; flex: 1; min-width: 0; }
.unit-input span { color: var(--muted); font-weight: 600; }
.unit-input:focus-within { border-color: var(--ball); }
.weight-range { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.sold-form .inline-form { margin-top: 0; }
.star-pick { display: flex; gap: 4px; }
.star-pick button { background: none; border: 0; font-size: 30px; line-height: 1; color: var(--line); cursor: pointer; padding: 2px; }
.star-pick button.on { color: #e0a100; }
.review-form textarea { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; }
.topbar-inner, .top-actions { flex-wrap: wrap; }
.owner-box { margin-top: 24px; padding: 14px 16px; border: 1.5px dashed var(--line); border-radius: 12px; }
.owner-box .hint { margin: 4px 0 0; }
.google-btn { display: inline-flex; align-items: center; gap: 10px; background: var(--surface); border: 1.5px solid var(--line); color: var(--fg); }
.google-btn:hover { border-color: var(--muted); }
.login-panel { max-width: 520px; display: grid; gap: 12px; justify-items: start; }
.login-panel p { margin: 0; }
.mini-link { display: flex; align-items: center; gap: 12px; color: inherit; text-decoration: none; min-width: 0; }
.mini-link .mini { flex: none; width: 52px; aspect-ratio: 1/1; background: var(--art-bg); border-radius: 8px; display: grid; place-items: center; overflow: hidden; }
.mini-link .mini svg { width: 60%; height: auto; }
.mini-link .mini img { width: 100%; height: 100%; object-fit: cover; }

<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./" id="homeLink" aria-label="Padeleiros, voltar a todas as raquetes">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="13" fill="#22a34a"/><path d="M4 11c5 3 17 3 22 0M4 19c5-3 17-3 22 0" stroke="#ffffff" stroke-width="1.6" fill="none"/></svg>
      <span class="brand-name">Padeleiros</span>
    </a>
    <div class="top-actions">
      <button class="sell-btn" id="sellBtn" type="button">Vender raquete</button>
      <button class="basket-btn" id="accountBtn" type="button" hidden>Entrar</button>
    </div>
  </div>
</header>

<main id="app"></main>

<footer>
  <span>Raquetes de padel, novas e usadas, entre jogadores. Contacte o vendedor diretamente.</span>
    <span><a href="privacidade.html">Privacidade</a> · <a href="termos.html">Termos</a></span>
</footer>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   SHOP SETTINGS — edit these
   ============================================================ */
const SHOP = {
  name: "Padeleiros",
  phone: "912 345 678",        // contact number for the shop's own rackets (RACKETS below)
  whatsapp: "351912345678"     // same number with country code, digits only
};

/* Page view statistics (GoatCounter, no cookies). Put your GoatCounter code here,
   e.g. "padeleiros" -> stats at https://padeleiros.goatcounter.com. Empty = switched off. */
const GOATCOUNTER = "padeleiros";

/* Database for listings from other sellers (see supabase-setup.sql).
   Leave empty to switch "Sell a racket" off. The publishable/anon key is meant to be public. */
const SUPABASE = {
  url: "https://llyqlkdndiupwvczjenj.supabase.co",
  key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxseXFsa2RuZGl1cHd2Y3pqZW5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzI2MDAsImV4cCI6MjEwNjk0ODYwMH0.D7RfoSlTDL2MRhK9QPf4ho_rAqFE9JzK1m6C77TF0vQ"
};

/* Your own rackets. condition: "New" | "Like new" | "Very good" | "Good" | "Fair"
   shape: "round" | "teardrop" | "diamond". colors draw the placeholder pictures
   until you add real photos (put image files in the repo and list them in photos). */
const RACKETS = [];   // add the shop's own rackets here (see README)
/* ============================================================ */

const ONLINE = !!(SUPABASE.url && SUPABASE.key);
const CONDITIONS = ["New", "Like new", "Very good", "Good", "Fair"];
const COND_PT = { "New": "Nova", "Like new": "Como nova", "Very good": "Muito bom estado", "Good": "Bom estado", "Fair": "Estado razoável" };
const SHAPE_PT = { round: "Redonda", teardrop: "Lágrima", diamond: "Diamante" };
const LOCATIONS = [
  ["Açores", ["São Miguel", "Terceira", "Faial", "Pico", "São Jorge", "Graciosa", "Santa Maria", "Flores", "Corvo"]],
  ["Madeira", ["Madeira", "Porto Santo"]],
  ["Continente", ["Aveiro", "Beja", "Braga", "Bragança", "Castelo Branco", "Coimbra", "Évora", "Faro", "Guarda", "Leiria",
                  "Lisboa", "Portalegre", "Porto", "Santarém", "Setúbal", "Viana do Castelo", "Vila Real", "Viseu"]]
];
const ALL_PLACES = LOCATIONS.flatMap(([, ps]) => ps);
const testIcon = `<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" style="flex:none"><circle cx="8" cy="8" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.8 8.2l2.1 2.1 4.3-4.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const placeText = r => [r.town, r.location].filter(Boolean).join(", ");
const pinIcon = `<svg width="11" height="14" viewBox="0 0 12 16" aria-hidden="true" style="flex:none"><path d="M6 0C2.7 0 0 2.6 0 5.9 0 10.3 6 16 6 16s6-5.7 6-10.1C12 2.6 9.3 0 6 0zm0 8.2a2.3 2.3 0 110-4.6 2.3 2.3 0 010 4.6z" fill="currentColor"/></svg>`;
const placeOptions = (selected, emptyLabel) => `<option value="">${emptyLabel}</option>` +
  LOCATIONS.map(([g, ps]) => `<optgroup label="${g}">${ps.map(x => `<option value="${esc(x)}" ${x === selected ? "selected" : ""}>${esc(x)}</option>`).join("")}</optgroup>`).join("");
const PALETTES = [["#111827","#f97316","#facc15"],["#0f172a","#22d3ee","#a3e635"],["#1f2937","#3b82f6","#e5e7eb"],["#111111","#dc2626","#fbbf24"],["#1e293b","#a855f7","#f5f5f5"]];

const euro = n => Number(n).toFixed(2).replace(".", ",") + " €";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmtPhone = p => p.replace(/(\d{3})(\d{3})(\d{3})/, "$1 $2 $3");
const shapePT = s => SHAPE_PT[s] || "";
const safeYouTube = u => /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(u || "") ? u : "";

const SHOP_SELLER = { key: "shop", name: SHOP.name, phone: SHOP.phone, whatsapp: SHOP.whatsapp, shop: true };
let ITEMS = RACKETS.map(r => ({ ...r, photos: r.photos || [], seller: SHOP_SELLER, remote: false }));
let listingsState = ONLINE ? "loading" : "off";
const byId = id => ITEMS.find(r => r.id === id) || ALL.find(r => r.id === id);

/* ---------- database and login ---------- */
const sb = ONLINE && window.supabase
  ? window.supabase.createClient(SUPABASE.url, SUPABASE.key, { auth: { flowType: "pkce", detectSessionInUrl: true, persistSession: true } })
  : null;
let user = null;
const PHOTO_RE = /^([0-9a-f-]{36}\/)?[a-z0-9-]+\.jpg$/;   // older listings have photos without a folder
/* Every photo is stored twice: full size (max 1400 px) for the listing page and a small
   copy "<name>-t.jpg" (max 600 px) for cards and thumbnails. Older photos have no small
   copy, so a small image that fails to load falls back to the full one. */
const thumbPath = p => p.replace(/\.jpg$/, "-t.jpg");
const withThumbs = paths => paths.flatMap(p => [p, thumbPath(p)]);
function smallImg(small, full, alt, attrs = "") {
  return `<img src="${esc(small)}" data-full="${esc(full)}" alt="${esc(alt)}" ${attrs} onerror="this.onerror=null;this.src=this.dataset.full">`;
}
const photoUrl = p => `${SUPABASE.url}/storage/v1/object/public/photos/${p.split("/").map(encodeURIComponent).join("/")}`;

let PROFILES = {};        // id -> { id, username, full_name, created_at }
let REVIEWS = [];         // { id, listing_id, seller_id, buyer_id, rating, comment, created_at }
let ALL = [];             // every listing from the database, sold ones included
let profilesState = ONLINE ? "loading" : "off";
const myProfile = () => (user && PROFILES[user.id]) || null;
const profileByName = u => Object.values(PROFILES).find(p => p.username === u) || null;
const displayName = p => p ? (p.full_name || "@" + p.username) : "";

function fromRow(row) {
  const pal = PALETTES[parseInt(row.id.slice(0, 2), 16) % PALETTES.length];
  const paths = (row.photos || []).filter(p => PHOTO_RE.test(p));
  const prof = PROFILES[row.user_id];
  return {
    id: "u" + row.id, uuid: row.id, remote: true, userId: row.user_id,
    soldAt: row.sold_at || null, buyerId: row.buyer_id || null, createdAt: row.created_at,
    location: row.location || "", town: row.town || "", canTest: !!row.can_test,
    name: row.name, condition: row.condition, price: Number(row.price),
    shape: row.shape || "teardrop", shapeKnown: !!row.shape, weight: row.weight || "", notes: row.notes || "",
    review: safeYouTube(row.review), colors: pal,
    photoPaths: paths, photos: paths.map(photoUrl), thumbs: paths.map(p => photoUrl(thumbPath(p))),
    seller: { key: "s:" + (row.user_id || row.seller_phone), name: prof ? displayName(prof) : row.seller_name,
              username: prof ? prof.username : "", phone: fmtPhone(row.seller_phone), whatsapp: "351" + row.seller_phone }
  };
}
const isMine = r => !!(user && r.remote && r.userId === user.id);
const shopItems = () => RACKETS.map(r => ({ ...r, photos: r.photos || [], seller: SHOP_SELLER, remote: false }));

function sellerStats(userId) {
  const rs = REVIEWS.filter(r => r.seller_id === userId);
  const avg = rs.length ? rs.reduce((s, r) => s + r.rating, 0) / rs.length : 0;
  return { count: rs.length, avg, sold: ALL.filter(l => l.userId === userId && l.soldAt).length };
}
const stars = (n, size = "") => {
  const full = Math.round(n);
  return `<span class="stars ${size}" role="img" aria-label="${n.toFixed(1).replace(".", ",")} de 5 estrelas">${"★".repeat(full)}<span class="stars-off">${"★".repeat(5 - full)}</span></span>`;
};
const ratingLine = userId => {
  const s = sellerStats(userId);
  return s.count ? `${stars(s.avg)} <span class="meta">${s.avg.toFixed(1).replace(".", ",")} · ${s.count} ${s.count === 1 ? "avaliação" : "avaliações"}</span>`
                 : `<span class="meta">Ainda sem avaliações</span>`;
};
const fmtDate = d => new Date(d).toLocaleDateString("pt-PT", { day: "numeric", month: "long", year: "numeric" });

async function loadListings() {
  if (!sb) { listingsState = ONLINE ? "error" : "off"; profilesState = listingsState; render(false); return; }
  try {
    const [pr, rv] = await Promise.all([
      sb.from("profiles").select("id,username,full_name,created_at").limit(5000),
      sb.from("reviews").select("id,listing_id,seller_id,buyer_id,rating,comment,created_at").order("created_at", { ascending: false }).limit(5000)
    ]);
    PROFILES = {}; (pr.data || []).forEach(p => PROFILES[p.id] = p);
    REVIEWS = rv.data || [];
    profilesState = pr.error ? "error" : "ok";
    let res = await sb.from("listings")
      .select("id,created_at,name,condition,price,shape,weight,notes,review,photos,seller_name,seller_phone,user_id,sold_at,buyer_id,location,town,can_test")
      .order("created_at", { ascending: false }).limit(1000);
    if (res.error) {   // database not upgraded yet: fall back to the older columns
      res = await sb.from("listings")
        .select("id,created_at,name,condition,price,shape,weight,notes,review,photos,seller_name,seller_phone,user_id,sold_at,buyer_id,location,town")
        .order("created_at", { ascending: false }).limit(1000);
    }
    if (res.error) {
      res = await sb.from("listings")
        .select("id,created_at,name,condition,price,shape,weight,notes,review,photos,seller_name,seller_phone,user_id,sold_at,buyer_id")
        .order("created_at", { ascending: false }).limit(1000);
    }
    if (res.error) {
      res = await sb.from("listings")
        .select("id,created_at,name,condition,price,shape,weight,notes,review,photos,seller_name,seller_phone,user_id")
        .order("created_at", { ascending: false }).limit(1000);
    }
    if (res.error) throw res.error;
    ALL = res.data.map(fromRow);
    ITEMS = [...ALL.filter(r => !r.soldAt), ...shopItems()];
    listingsState = "ok";
  } catch (e) {
    listingsState = "error";
    if (profilesState === "loading") profilesState = "error";
  }
  render(false);
}

/* ---------- pictures ---------- */
const HEADS = {
  round:    "M100,22 C152,22 180,60 180,112 C180,166 146,202 100,204 C54,202 20,166 20,112 C20,60 48,22 100,22Z",
  teardrop: "M100,16 C156,16 182,52 182,98 C182,150 142,194 100,206 C58,194 18,150 18,98 C18,52 44,16 100,16Z",
  diamond:  "M100,12 C142,12 178,42 182,82 C186,126 142,184 100,208 C58,184 14,126 18,82 C22,42 58,12 100,12Z"
};
let svgSeq = 0;
function racketSVG(r, view = "front") {
  const [frame, accent, light] = r.colors;
  const head = HEADS[r.shape] || HEADS.teardrop;
  const uid = "c" + (svgSeq++);
  const grip = x => [0,1,2,3,4,5].map(i => `<path d="M${x},${254+i*9} L${200-x},${259+i*9}" stroke="${light}" stroke-opacity=".35" stroke-width="2"/>`).join("");
  if (view === "side") {
    return `<svg viewBox="0 0 200 320" role="img" aria-label="${esc(r.name)}, vista lateral">
      <path d="M93,14 C99,12 101,12 107,14 L109,200 L104,250 L96,250 L91,200Z" fill="${frame}"/>
      <rect x="95.5" y="14" width="9" height="186" fill="${accent}" opacity=".85"/>
      <rect x="91" y="248" width="18" height="62" rx="5" fill="${frame}"/>${grip(91)}</svg>`;
  }
  let holes = "";
  for (let y = 46; y < 196; y += 15) for (let x = 34; x < 170; x += 15) {
    holes += `<circle cx="${x + (((y - 46) / 15) % 2 ? 7 : 0)}" cy="${y}" r="3.6"/>`;
  }
  const faceArt = view === "back"
    ? `<path d="M10,150 L100,90 L190,150 L190,175 L100,115 L10,175Z" fill="${accent}"/>
       <path d="M10,190 L100,130 L190,190 L190,202 L100,142 L10,202Z" fill="${light}" opacity=".9"/>`
    : `<path d="M-10,80 L210,20 L210,62 L-10,122Z" fill="${accent}"/>
       <path d="M-10,128 L210,68 L210,78 L-10,138Z" fill="${light}" opacity=".9"/>
       <circle cx="100" cy="160" r="16" fill="none" stroke="${light}" stroke-width="3" opacity=".8"/>`;
  const vb = view === "detail" ? "34 20 132 132" : "0 0 200 320";
  return `<svg viewBox="${vb}" role="img" aria-label="${esc(r.name)}, vista ${({front:"frontal",back:"traseira",detail:"de pormenor"})[view] || ""}">
    <defs><clipPath id="${uid}"><path d="${head}"/></clipPath></defs>
    <path d="M80,190 L94,250 L106,250 L120,190 L112,190 L100,226 L88,190Z" fill="${frame}"/>
    <g clip-path="url(#${uid})"><rect width="200" height="220" fill="${frame}"/>${faceArt}<g fill="${frame}" opacity=".9">${holes}</g></g>
    <path d="${head}" fill="none" stroke="${frame}" stroke-width="9"/>
    <path d="${head}" fill="none" stroke="${accent}" stroke-width="2" opacity=".7"/>
    <rect x="88" y="248" width="24" height="62" rx="6" fill="${frame}"/>${grip(88)}</svg>`;
}
const VIEWS = [["front","Frente"],["back","Verso"],["side","Lado"],["detail","Pormenor"]];
const cover = r => r.photos.length ? smallImg(r.thumbs[0], r.photos[0], r.name, 'loading="lazy"') : racketSVG(r);
/* html: full-size picture (listing page). small: small picture (cards, thumbnail strip). */
function galleryItems(r) {
  if (!r.photos.length) return VIEWS.map(([v, l]) => { const svg = racketSVG(r, v); return { label: l, html: svg, small: svg }; });
  return r.photos.map((u, i) => ({
    label: "Foto " + (i + 1),
    html: `<img src="${esc(u)}" alt="${esc(r.name)}, foto ${i + 1}">`,
    small: smallImg(r.thumbs[i], u, `${r.name}, foto ${i + 1}`, 'loading="lazy"'),
    smallUrl: r.thumbs[i], full: u
  }));
}

/* ---------- small helpers ---------- */
function store(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function put(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }


let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
}
function copyText(txt, label) {
  try { navigator.clipboard.writeText(txt).then(() => toast("Copiado: " + label.toLowerCase()), () => toast("Selecione o texto para o copiar")); }
  catch (e) { toast("Selecione o texto para o copiar"); }
}

/* ---------- views ---------- */
const app = document.getElementById("app");
let filter = "all";
let place = "";

const chip = c => `<span class="chip ${c === "New" ? "new" : "used"}">${esc(c === "New" ? "Nova" : "Usada · " + COND_PT[c])}</span>`;
const ytIcon = `<svg width="16" height="12" viewBox="0 0 16 12" aria-hidden="true"><rect width="16" height="12" rx="3" fill="#ff0033"/><path d="M6.4 3.4v5.2L10.8 6Z" fill="#fff"/></svg>`;

function viewShop() {
  const list = ITEMS.filter(r => (filter === "all" || (filter === "new" ? r.condition === "New" : r.condition !== "New"))
                              && (!place || r.location === place));
  const status = listingsState === "loading" ? `<p class="status">A carregar raquetes de outros vendedores…</p>`
    : listingsState === "error" ? `<p class="error">Não foi possível carregar as raquetes de outros vendedores. Atualize a página para tentar de novo.</p>` : "";
  app.innerHTML = `
    <section class="intro">
      <div>
        <h1>Raquetes de padel</h1>
        <p>Raquetes novas e em segunda mão de jogadores perto de si. Toque numa raquete para ver mais fotos. ${ONLINE ? "Tem uma para vender? Anuncie-a num minuto." : ""}</p>
      </div>
      <div class="filter-bar">
        <div class="filters" role="group" aria-label="Filtrar por estado">
          ${[["all","Todas"],["new","Novas"],["used","Usadas"]].map(([k,l]) =>
            `<button class="filter" type="button" data-filter="${k}" aria-pressed="${filter === k}">${l}</button>`).join("")}
        </div>
        <label class="place-filter">${pinIcon}<span class="sr-only">Localização</span>
          <select id="placeFilter" aria-label="Filtrar por localização">${placeOptions(place, "Todas as localizações")}</select></label>
      </div>
    </section>
    ${status}
    <section class="grid">
      ${list.map(card).join("")}
    </section>
    ${!list.length && listingsState !== "loading" ? `<div class="panel empty"><p>${filter === "all" && !place ? "Ainda não há raquetes à venda." : "Não há raquetes " + (filter === "new" ? "novas " : filter === "used" ? "usadas " : "") + "à venda" + (place ? " em " + esc(place) : "") + " neste momento."}</p>${ONLINE ? `<button class="btn btn-primary" type="button" id="firstSell">Anunciar uma raquete</button>` : ""}</div>` : ""}
`;
  app.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => { filter = b.dataset.filter; viewShop(); });
  document.getElementById("placeFilter").onchange = e => { place = e.target.value; viewShop(); };
  const fs = document.getElementById("firstSell"); if (fs) fs.onclick = () => { sellResult = null; go("sell"); };
}

function viewRacket(r) {
  const g = galleryItems(r);
  const mine = isMine(r);
  const specs = [
    ["Estado", COND_PT[r.condition]],
    ["Formato", r.shapeKnown === false ? "" : shapePT(r.shape)],
    ["Peso", r.weight], ["Núcleo", r.core], ["Face", r.face], ["Ano", r.year]
  ].filter(([, v]) => v);
  const sp = r.remote && PROFILES[r.userId];
  const sellerBox = sp
    ? `<a class="seller-box" href="#p-${esc(sp.username)}"><span class="avatar sm" aria-hidden="true">${esc((sp.full_name || sp.username)[0].toUpperCase())}</span><span style="min-width:0"><b>${esc(displayName(sp))}</b><br>${ratingLine(sp.id)}</span><span class="chev" aria-hidden="true">›</span></a>`
    : `<div class="seller-box"><span class="avatar sm" aria-hidden="true">${esc(r.seller.name[0].toUpperCase())}</span><span><b>${esc(r.seller.name)}</b><br><span class="meta">${r.remote ? "Vendedor" : "Loja Padeleiros"}</span></span></div>`;
  app.innerHTML = `
    <button class="back" type="button" id="back">← Todas as raquetes</button>
    <section class="detail">
      <div>
        <div class="gallery-main" id="mainPic">${g[0].html}</div>
        ${g.length > 1 ? `<div class="thumbs">
          ${g.map((it, i) => `<div><button class="thumb" type="button" data-i="${i}" aria-current="${i===0}" aria-label="Mostrar ${esc(it.label)}">${it.small}</button><div class="thumb-label">${esc(it.label)}</div></div>`).join("")}
        </div>` : ""}
      </div>
      <div>
        ${chip(r.condition)}
        <h1>${esc(r.name)}</h1>
        <div class="price">${euro(r.price)}</div>
        ${placeText(r) ? `<div class="place big">${pinIcon}<span>${esc(placeText(r))}</span></div>` : ""}
        ${r.canTest ? `<div class="test-line">${testIcon}<span><b>Pode ser experimentada</b> antes da compra. Combine com o vendedor.</span></div>` : ""}
        ${r.soldAt ? `<p class="sold-banner">Vendida em ${fmtDate(r.soldAt)}</p>` : ""}
        ${sellerBox}
        <dl class="specs">${specs.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>
        ${r.notes ? `<p class="notes">${esc(r.notes)}</p>` : ""}
        ${r.review ? `<div class="actions"><a class="btn btn-ghost yt" href="${esc(r.review)}" target="_blank" rel="noopener">${ytIcon} Ver review no YouTube</a></div>` : ""}
        ${mine || r.soldAt ? "" : contactBox(r)}
        ${mine && !r.soldAt ? `
        <div class="owner-box">
          <b>Este anúncio é seu.</b>
          <p class="hint">Quando vender a raquete, marque-a como vendida em <a href="#account">A minha conta</a> para o comprador a poder avaliar. Se desistir de vender, remova o anúncio.</p>
          <div class="inline-form"><a class="btn btn-dark" href="#edit-${esc(r.id)}" style="text-decoration:none">Editar anúncio</a>${removeButton(r)}</div>
        </div>` : ""}
      </div>
    </section>`;
  document.getElementById("back").onclick = () => go("shop");
  const cp = document.getElementById("copyPhone");
  if (cp) cp.onclick = () => copyText(r.seller.phone.replace(/\s/g, ""), "Número");
  app.querySelectorAll(".thumb").forEach(t => t.onclick = () => {
    document.getElementById("mainPic").innerHTML = g[+t.dataset.i].html;
    app.querySelectorAll(".thumb").forEach(x => x.setAttribute("aria-current", x === t));
  });
  wireRemoveButtons(() => go("account"));
}

/* Two-step remove: first tap asks, second tap removes. */
const removeButton = r => `<button class="btn btn-ghost" type="button" data-del="${esc(r.id)}">Remover anúncio</button>`;
function wireRemoveButtons(after) {
  app.querySelectorAll("[data-del]").forEach(b => b.onclick = async () => {
    if (b.dataset.armed !== "1") {
      b.dataset.armed = "1"; b.textContent = "Confirmar remoção"; b.classList.replace("btn-ghost", "btn-dark");
      setTimeout(() => { if (b.isConnected && b.dataset.armed === "1") { b.dataset.armed = ""; b.textContent = "Remover anúncio"; b.classList.replace("btn-dark", "btn-ghost"); } }, 4000);
      return;
    }
    const r = byId(b.dataset.del);
    if (!r) return;
    b.disabled = true; b.textContent = "A remover…";
    try {
      const { data, error } = await sb.from("listings").delete().eq("id", r.uuid).select("id");
      if (error) throw error;
      if (!data || !data.length) throw new Error("not yours");
      if (r.photoPaths.length) await sb.storage.from("photos").remove(withThumbs(r.photoPaths));
      ITEMS = ITEMS.filter(x => x.id !== r.id);
      toast("Anúncio removido");
      after();
    } catch (ex) {
      b.disabled = false; b.dataset.armed = ""; b.textContent = "Remover anúncio";
      toast("Não foi possível remover o anúncio. Tente de novo.");
    }
  });
}

/* ----- profile setup (username + optional name) ----- */
function viewSetup() {
  if (!user) return viewLogin();
  const p = myProfile();
  const m = user.user_metadata || {};
  const suggested = p ? p.username
    : (m.full_name || m.name || (user.email || "").split("@")[0] || "")
        .toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9_.]+/g, ".").replace(/^\.+|\.+$/g, "").slice(0, 20);
  app.innerHTML = `
    <h1 class="page-title">${p ? "Editar perfil" : "Escolha o seu nome de utilizador"}</h1>
    <form class="panel login-panel" id="setupForm" novalidate>
      ${p ? "" : `<p>É assim que os compradores o vão ver no Padeleiros. Pode mudar mais tarde.</p>`}
      <div class="field" style="width:100%"><label for="u-name">Nome de utilizador</label>
        <div class="at-input"><span aria-hidden="true">@</span><input id="u-name" maxlength="20" autocomplete="username" autocapitalize="none" spellcheck="false" value="${esc(suggested)}" required></div>
        <span class="hint">3 a 20 caracteres: letras minúsculas, números, ponto ou _.</span></div>
      <div class="field" style="width:100%"><label for="u-full">Nome (opcional)</label>
        <input id="u-full" maxlength="60" autocomplete="name" value="${esc(p ? p.full_name || "" : (m.full_name || m.name || ""))}">
        <span class="hint">Se o preencher, aparece nos seus anúncios em vez do nome de utilizador.</span></div>
      <p class="error" id="setupError" hidden></p>
      <div class="actions" style="margin-top:0">
        <button class="btn btn-primary" type="submit" id="setupSave">${p ? "Guardar" : "Continuar"}</button>
        ${p ? `<button class="btn btn-ghost" type="button" id="setupCancel">Cancelar</button>` : ""}
      </div>
    </form>`;
  const un = document.getElementById("u-name");
  un.oninput = () => { const v = un.value.toLowerCase().replace(/[^a-z0-9_.]/g, ""); if (v !== un.value) un.value = v; };
  const cancel = document.getElementById("setupCancel"); if (cancel) cancel.onclick = () => go("account");
  document.getElementById("setupForm").onsubmit = async e => {
    e.preventDefault();
    const err = document.getElementById("setupError");
    const fail = m => { err.textContent = m; err.hidden = false; };
    const username = un.value.trim();
    const full = document.getElementById("u-full").value.trim();
    if (!/^[a-z0-9_.]{3,20}$/.test(username)) return fail("O nome de utilizador tem de ter 3 a 20 caracteres: letras minúsculas, números, ponto ou _.");
    const taken = profileByName(username);
    if (taken && taken.id !== user.id) return fail("Esse nome de utilizador já está ocupado. Escolha outro.");
    const btn = document.getElementById("setupSave"); btn.disabled = true;
    const row = { username, full_name: full || null };
    const { data, error } = p
      ? await sb.from("profiles").update(row).eq("id", user.id).select("id,username,full_name,created_at").single()
      : await sb.from("profiles").insert({ id: user.id, ...row }).select("id,username,full_name,created_at").single();
    btn.disabled = false;
    if (error) return fail(error.code === "23505" ? "Esse nome de utilizador já está ocupado. Escolha outro."
                                                 : "Não foi possível guardar o perfil (" + error.message + "). Tente de novo.");
    PROFILES[user.id] = data;
    ALL = ALL.map(r => r.userId === user.id ? { ...r, seller: { ...r.seller, name: displayName(data), username: data.username } } : r);
    ITEMS = [...ALL.filter(r => !r.soldAt), ...shopItems()];
    updateAccountBtn();
    toast(p ? "Perfil guardado" : "Bem-vindo, @" + data.username);
    let next = "account";
    try { next = sessionStorage.getItem("bandeja-after-setup") || next; sessionStorage.removeItem("bandeja-after-setup"); } catch (x) {}
    go(next);
  };
}

/* Card picture: every photo is stacked; moving the mouse across the picture shows the photo
   for that slice of its width, and the dots underneath show which one is on. */
function cardArt(r) {
  const g = galleryItems(r);
  if (g.length < 2) return `<div class="art"><div class="art-slide on">${g[0].small}</div></div>`;
  // only the cover downloads with the page; the rest wait (data-src) until the card is hovered
  const slide = (it, i) => i === 0 || !it.smallUrl ? it.small
    : `<img data-src="${esc(it.smallUrl)}" data-full="${esc(it.full)}" alt="${esc(r.name)}, foto ${i + 1}" onerror="this.onerror=null;this.src=this.dataset.full">`;
  return `<div class="art" data-slides="${g.length}">
    ${g.map((it, i) => `<div class="art-slide${i ? "" : " on"}">${slide(it, i)}</div>`).join("")}
    <div class="art-dots" aria-hidden="true">${g.map((_, i) => `<span${i ? "" : ' class="on"'}></span>`).join("")}</div>
  </div>`;
}
function showSlide(art, i) {
  art.querySelectorAll("img[data-src]").forEach(img => { img.src = img.dataset.src; img.removeAttribute("data-src"); });
  if (+art.dataset.cur === i) return;
  art.dataset.cur = i;
  art.querySelectorAll(".art-slide").forEach((el, k) => el.classList.toggle("on", k === i));
  art.querySelectorAll(".art-dots span").forEach((el, k) => el.classList.toggle("on", k === i));
}
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const art = e.target.closest && e.target.closest(".art[data-slides]");
  if (!art) return;
  const box = art.getBoundingClientRect();
  const n = +art.dataset.slides;
  showSlide(art, Math.min(n - 1, Math.max(0, Math.floor((e.clientX - box.left) / box.width * n))));
});
document.addEventListener("pointerout", e => {
  const art = e.target.closest && e.target.closest(".art[data-slides]");
  if (art && !art.contains(e.relatedTarget)) showSlide(art, 0);
});

      const { data, error } = await sb.from("reviews")
        .insert({ listing_id: r.uuid, seller_id: r.userId, rating, comment: comment || null })
        .select("id,listing_id,seller_id,buyer_id,rating,comment,created_at").single();
      btn.disabled = false;
      if (error) { err.textContent = error.code === "23505" ? "Já avaliou esta compra." : "Não foi possível publicar a avaliação. Tente de novo."; err.hidden = false; return; }
      REVIEWS = [data, ...REVIEWS];
      toast("Avaliação publicada");
      viewAccount();
    };
  });
}

const reviewForm = r => `
  <form class="review-form" id="rf-${esc(r.id)}" hidden>
    <span class="field-label">Como correu a compra a ${esc(r.seller.name)}?</span>
    <div class="star-pick" role="group" aria-label="Classificação">${[1,2,3,4,5].map(n => `<button type="button" data-n="${n}" aria-pressed="false" aria-label="${n} ${n === 1 ? "estrela" : "estrelas"}">★</button>`).join("")}</div>
    <label for="rc-${esc(r.id)}" class="field-label">Comentário (opcional)</label>
    <textarea id="rc-${esc(r.id)}" rows="3" maxlength="500" placeholder="A raquete correspondia ao anúncio? O vendedor foi rápido?"></textarea>
    <p class="error" hidden></p>
    <button class="btn btn-primary" type="submit">Publicar avaliação</button>
  </form>`;

/* ----- selling ----- */
let sellResult = null;
const viewSell = () => viewListingForm(null);

/* One form for a new listing and for editing one. `r` is the listing being edited, or null. */
function viewListingForm(r) {
  const editing = !!r;
  if (!sb) {
    app.innerHTML = `<h1 class="page-title">Vender raquete</h1>
      <div class="panel"><p>As vendas ainda não estão ativas. O dono da loja tem de adicionar os dados da base de dados nas definições.</p></div>`;
    return;
  }
  if (!user) return viewLogin("Para anunciar uma raquete, entre com a sua conta Google. Assim pode gerir e remover os seus anúncios quando quiser.");
  if (!myProfile()) { if (profilesState === "loading") { app.innerHTML = `<p class="status">A carregar…</p>`; return; } try { sessionStorage.setItem("bandeja-after-setup", "sell"); } catch (e) {} return viewSetup(); }
  if (editing && (!isMine(r) || r.soldAt)) {
    app.innerHTML = `<h1 class="page-title">Editar anúncio</h1><div class="panel"><p>${r.soldAt ? "Esta raquete já foi vendida, por isso o anúncio já não pode ser editado." : "Só pode editar os seus próprios anúncios."}</p></div>`;
    return;
  }
  if (!editing && sellResult) {
    const x = sellResult;
    app.innerHTML = `<h1 class="page-title">A sua raquete está anunciada</h1>
      <div class="panel" style="max-width:640px">
        <p><b>${esc(x.name)}</b> já está na página inicial.</p>
        <p class="hint">Pode editá-la ou, quando a vender, marcá-la como vendida em <b>A minha conta</b>.</p>
        <div class="actions">
          <a class="btn btn-primary" href="#r-u${esc(x.id)}" style="text-decoration:none">Ver o seu anúncio</a>
          <button class="btn btn-ghost" type="button" id="another">Anunciar outra raquete</button>
        </div>
      </div>`;
    document.getElementById("another").onclick = () => { sellResult = null; viewSell(); };
    return;
  }

  // values to prefill
  const wNums = editing ? (r.weight.match(/\d+/g) || []) : [];
  const val = editing ? {
    name: r.name, condition: r.condition, price: String(r.price).replace(".", ","), shape: r.shapeKnown === false ? "" : r.shape,
    w1: wNums[0] || "", w2: wNums[1] || "", notes: r.notes, review: r.review, place: r.location, town: r.town,
    phone: r.seller.phone.replace(/\D/g, ""), canTest: !!r.canTest
  } : {
    name: "", condition: "New", price: "", shape: "", w1: "", w2: "", notes: "", review: "",
    place: store("bandeja-last-place", ""), town: store("bandeja-last-town", ""), phone: store("bandeja-last-phone", ""), canTest: false
  };
  // photos: existing ones (editing) and new files, in display order
  let pics = editing ? r.photoPaths.map((path, i) => ({ path, url: r.thumbs[i], full: r.photos[i] })) : [];

  app.innerHTML = `
    <button class="back" type="button" id="back">← ${editing ? "Voltar ao anúncio" : "Todas as raquetes"}</button>
    <h1 class="page-title">${editing ? "Editar anúncio" : "Vender raquete"}</h1>
    <div class="sell-layout">
      <form class="panel" id="sellForm" novalidate>
        <div class="field"><label for="s-name">Nome da raquete</label><input id="s-name" maxlength="80" placeholder="Marca, modelo e ano" value="${esc(val.name)}" required></div>
        <div class="two">
          <div class="field"><label for="s-cond">Estado</label>
            <select id="s-cond">${CONDITIONS.map(c => `<option value="${c}" ${c === val.condition ? "selected" : ""}>${COND_PT[c]}</option>`).join("")}</select></div>
          <div class="field"><label for="s-price">Preço (€)</label><input id="s-price" inputmode="decimal" placeholder="120" value="${esc(val.price)}" required></div>
        </div>
        <div class="two">
          <div class="field"><label for="s-shape">Formato</label>
            <select id="s-shape">${[["","Não sei"],["round","Redonda"],["teardrop","Lágrima"],["diamond","Diamante"]].map(([k, l]) => `<option value="${k}" ${k === val.shape ? "selected" : ""}>${l}</option>`).join("")}</select></div>
          <div class="field"><label for="s-weight">Peso (opcional)</label>
            <div class="weight-range">
              <div class="unit-input"><input id="s-weight" inputmode="numeric" maxlength="3" placeholder="355" value="${esc(val.w1)}" aria-label="Peso, ou peso mínimo"><span aria-hidden="true">g</span></div>
              <span class="meta">até</span>
              <div class="unit-input"><input id="s-weight2" inputmode="numeric" maxlength="3" placeholder="375" value="${esc(val.w2)}" aria-label="Peso máximo (opcional)"><span aria-hidden="true">g</span></div>
            </div>
            <span class="hint">Com pesos removíveis, indique o mínimo e o máximo. Se não, só o primeiro.</span></div>
        </div>
        <div class="field"><span class="field-label">Fotos (até 4)</span>
          <div class="previews" id="previews"></div>
          <label class="btn btn-ghost add-photos" id="addPhotosBtn" for="s-photos">Adicionar fotos</label>
          <input id="s-photos" type="file" accept="image/*" multiple class="sr-only">
          <span class="hint">Frente, verso e quaisquer marcas ou danos. A primeira foto é a capa.</span></div>
        <div class="field"><label for="s-notes">Descrição</label><textarea id="s-notes" rows="4" maxlength="600" placeholder="Quanto foi usada, marcas, o que inclui">${esc(val.notes)}</textarea></div>
        <div class="field"><label for="s-review">Link de review no YouTube (opcional)</label><input id="s-review" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" value="${esc(val.review)}"></div>
        <div class="two">
          <div class="field"><label for="s-place">Localização</label>
            <select id="s-place" required>${placeOptions(val.place, "Escolha a ilha ou distrito")}</select></div>
          <div class="field"><label for="s-town">Localidade (opcional)</label><input id="s-town" maxlength="60" placeholder="Ponta Delgada" value="${esc(val.town)}"></div>
        </div>
        <label class="check check-soft"><input type="checkbox" id="s-test" ${val.canTest ? "checked" : ""}> <span><b>Pode ser experimentada</b> (opcional)<br><span class="meta">Os interessados podem testar a raquete antes de comprar. Combinam o dia e o local consigo.</span></span></label>
        <div class="field"><label for="s-phone">O seu telemóvel (WhatsApp)</label><input id="s-phone" inputmode="tel" autocomplete="tel" placeholder="9XX XXX XXX" value="${esc(val.phone)}" required>
          <span class="hint">O anúncio aparece com o nome do seu perfil: <b>${esc(displayName(myProfile()))}</b>.</span></div>
        ${editing ? "" : `<label class="check"><input type="checkbox" id="s-consent"> <span>Compreendo que o nome do meu perfil e o meu número de telemóvel ficam visíveis no anúncio, para que os compradores interessados me contactem por WhatsApp ou telefone.</span></label>`}
        <p class="error" id="sellError" hidden></p>
        <div class="actions" style="margin-top:14px">
          <button class="btn btn-primary" type="submit" id="sellSubmit" style="flex:1">${editing ? "Guardar alterações" : "Anunciar a minha raquete"}</button>
          ${editing ? `<button class="btn btn-ghost" type="button" id="cancelEdit">Cancelar</button>` : ""}
        </div>
      </form>
      <div class="panel">
        <div style="font-weight:700;margin-bottom:6px">Como funciona a venda</div>
        <ol class="steps">
          <li>A sua raquete aparece logo na página inicial.</li>
          <li>Quem estiver interessado contacta-o por WhatsApp ou telefone.</li>
          <li>Combinam diretamente o pagamento e a entrega.</li>
          <li>Pode editar o anúncio a qualquer momento em <a href="#account">A minha conta</a>.</li>
          <li>Quando vender, marque-a como vendida para o comprador o poder avaliar.</li>
        </ol>
      </div>
    </div>`;

  const backTo = editing ? "r-" + r.id : "shop";
  document.getElementById("back").onclick = () => go(backTo);
  const cancel = document.getElementById("cancelEdit"); if (cancel) cancel.onclick = () => go(backTo);
  ["s-weight", "s-weight2"].forEach(id => { const wt = document.getElementById(id);
    wt.oninput = () => { const d = wt.value.replace(/\D/g, ""); if (d !== wt.value) wt.value = d; }; });

  const drawPics = () => {
    document.getElementById("previews").innerHTML = pics.map((p, i) => `
      <div class="pic">
        ${smallImg(p.url, p.full || p.url, "Foto " + (i + 1))}
        ${i === 0 ? `<span class="pic-tag">Capa</span>` : ""}
        <button type="button" class="pic-x" data-i="${i}" aria-label="Tirar a foto ${i + 1}">×</button>
      </div>`).join("");
    document.getElementById("addPhotosBtn").hidden = pics.length >= 4;
    document.querySelectorAll(".pic-x").forEach(b => b.onclick = () => { pics.splice(+b.dataset.i, 1); drawPics(); });
  };
  drawPics();
  const input = document.getElementById("s-photos");
  input.onchange = () => {
    const room = 4 - pics.length;
    const chosen = [...input.files].filter(f => f.type.startsWith("image/"));
    chosen.slice(0, room).forEach(file => pics.push({ file, url: URL.createObjectURL(file) }));
    if (chosen.length > room) toast("Só cabem 4 fotos por anúncio");
    input.value = "";
    drawPics();
  };

  document.getElementById("sellForm").onsubmit = async e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    const err = document.getElementById("sellError");
    const fail = m => { err.textContent = m; err.hidden = false; };
    err.hidden = true;
    const price = parseFloat(v("s-price").replace(",", "."));
    const phone = v("s-phone").replace(/\D/g, "").replace(/^351/, "");
    const review = v("s-review");
    if (v("s-name").length < 3) return fail("Introduza o nome da raquete, por exemplo marca e modelo.");
    if (!(price > 0 && price < 5000)) return fail("Introduza um preço em euros, por exemplo 120.");
    if (review && !safeYouTube(review)) return fail("O link da review tem de ser um link do YouTube que comece por https://.");
    const w1 = v("s-weight"), w2 = v("s-weight2"), okW = w => +w >= 250 && +w <= 450;
    if (w2 && !w1) return fail("Indique o peso mínimo no primeiro campo.");
    if ((w1 && !okW(w1)) || (w2 && !okW(w2))) return fail("Indique o peso em gramas, entre 250 e 450 (por exemplo 365).");
    if (w2 && +w2 <= +w1) return fail("O peso máximo tem de ser maior do que o mínimo.");
    if (!pics.length) return fail("Adicione pelo menos uma foto da raquete.");
    if (!ALL_PLACES.includes(v("s-place"))) return fail("Escolha a localização da raquete.");
    if (!/^9[1236]\d{7}$/.test(phone)) return fail("Introduza o seu telemóvel: 9 dígitos, a começar por 91, 92, 93 ou 96.");
    if (!editing && !document.getElementById("s-consent").checked) return fail("Marque a caixa para aceitar mostrar o seu nome e número.");
    if (!user) return viewLogin();
    const btn = document.getElementById("sellSubmit");
    btn.disabled = true;
    const uploaded = [];
    try {
      const newPics = pics.filter(p => p.file);
      const paths = [];
      for (const p of pics) {
        if (!p.file) { paths.push(p.path); continue; }
        btn.textContent = `A enviar foto ${uploaded.length + 1} de ${newPics.length}…`;
        const [blob, small] = await Promise.all([shrink(p.file), shrink(p.file, 600, 0.75)]);
        const path = `${user.id}/${(crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + paths.length + "-" + Math.random().toString(16).slice(2))}.jpg`;
        const up1 = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
        if (up1.error) throw up1.error;
        uploaded.push(path);
        const up2 = await sb.storage.from("photos").upload(thumbPath(path), small, { contentType: "image/jpeg" });
        if (up2.error) throw up2.error;
        uploaded.push(thumbPath(path)); paths.push(path);
      }
      btn.textContent = editing ? "A guardar…" : "A publicar…";
      const fields = {
        p_name: v("s-name"), p_condition: v("s-cond"), p_price: Math.round(price * 100) / 100,
        p_shape: v("s-shape"), p_weight: weightText(w1, w2), p_notes: v("s-notes"),
        p_review: review, p_photos: paths, p_seller_phone: phone, p_location: v("s-place"), p_town: v("s-town"),
        p_can_test: document.getElementById("s-test").checked
      };
      put("bandeja-last-phone", phone); put("bandeja-last-place", v("s-place")); put("bandeja-last-town", v("s-town"));
      if (editing) {
        const { data: ok, error } = await sb.rpc("update_listing", { p_id: r.uuid, ...fields });
        if (error) throw error;
        if (!ok) throw new Error("o anúncio já não pode ser editado");
        const removed = r.photoPaths.filter(p => !paths.includes(p) && p.startsWith(user.id + "/"));
        if (removed.length) sb.storage.from("photos").remove(withThumbs(removed)).catch(() => {});
        toast("Alterações guardadas");
        await loadListings();
        go("r-" + r.id);
      } else {
        const { data: newId, error } = await sb.rpc("create_listing", fields);
        if (error) throw error;
        sellResult = { id: newId, name: v("s-name") };
        viewSell(); window.scrollTo(0, 0);
        loadListings();
      }
    } catch (ex) {
      if (uploaded.length) sb.storage.from("photos").remove(uploaded).catch(() => {});
      btn.disabled = false; btn.textContent = editing ? "Guardar alterações" : "Anunciar a minha raquete";
      fail((editing ? "Não foi possível guardar as alterações (" : "Não foi possível anunciar a raquete (") + (ex.message || "erro") + "). Verifique a ligação e tente de novo.");
    }
  };
}

/* "355 g", or "355–375 g" for rackets with removable weights */
const weightText = (a, b) => !a ? "" : b && +b > +a ? `${a}–${b} g` : `${a} g`;

function shrink(file, max = 1400, quality = 0.82) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? resolve(b) : reject(new Error("não foi possível ler a foto")), "image/jpeg", quality);
    };
    img.onerror = () => reject(new Error("não foi possível ler a foto"));
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- routing ---------- */
/* The front page has no "#…" in the address; every other view does. */
function go(where) {
  if (where === "shop" || where === "") {
    if (location.hash) history.pushState(null, "", location.pathname + location.search);
    render();
  } else if (location.hash === "#" + where) render();
  else location.hash = where;
}
/* Counts one page view each time the visitor lands on a different page.
   The front page is "/", others keep their #… address (e.g. "/#r-u<id>" for a racket). */
let lastCounted = null;
function countView() {
  if (!GOATCOUNTER) return;
  const path = location.pathname + location.hash;
  if (path === lastCounted) return;
  const h = location.hash.slice(1);
  if (h.startsWith("r-u") && !byId(h.slice(2))) return;          // wait until the racket has loaded
  if (h.startsWith("p-") && !profileByName(h.slice(2))) return;  // wait until the seller has loaded
  lastCounted = path;
  const r = h.startsWith("r-") ? byId(h.slice(2)) : null;
  const title = r ? r.name : h.startsWith("p-") ? "@" + h.slice(2) : document.title;
  const send = () => window.goatcounter.count({ path, title });
  if (window.goatcounter && window.goatcounter.count) send();
  else (window.gcQueue = window.gcQueue || []).push(send);
}
if (GOATCOUNTER) {
  window.goatcounter = { no_onload: true };
  const gc = document.createElement("script");
  gc.async = true;
  gc.src = "https://gc.zgo.at/count.js";
  gc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  gc.onload = () => (window.gcQueue || []).splice(0).forEach(f => f());
  document.head.appendChild(gc);
}

function render(scroll = true) {
  setTimeout(countView, 0);
  const h = location.hash.slice(1);
  if (scroll) window.scrollTo(0, 0);
  if (user && profilesState === "ok" && !myProfile() && !["setup", "login"].includes(h)) {
    try { sessionStorage.setItem("bandeja-after-setup", h || "shop"); } catch (e) {}
    return viewSetup();
  }
  if (h.startsWith("r-") && byId(h.slice(2))) viewRacket(byId(h.slice(2)));
  else if (h.startsWith("r-u") && listingsState === "loading") app.innerHTML = `<p class="status">A carregar raquete…</p>`;
  else if (h === "sell") viewSell();
  else if (h.startsWith("edit-")) { const r = byId(h.slice(5)); if (r) viewListingForm(r); else app.innerHTML = listingsState === "loading" ? `<p class="status">A carregar…</p>` : `<div class="panel"><p>Este anúncio já não existe.</p></div>`; }
  else if (h === "login") viewLogin();
  else if (h === "setup") viewSetup();
  else if (h.startsWith("p-")) viewProfile(h.slice(2));
  else if (h === "account") viewAccount();
  else viewShop();
}
window.addEventListener("hashchange", () => render());
window.addEventListener("popstate", () => render());
document.getElementById("homeLink").onclick = e => { e.preventDefault(); go("shop"); };
if (location.hash === "#shop") history.replaceState(null, "", location.pathname + location.search);
document.getElementById("sellBtn").onclick = () => { sellResult = null; go("sell"); };
function updateAccountBtn() {
  const b = document.getElementById("accountBtn");
  b.hidden = !sb;
  b.textContent = user ? "A minha conta" : "Entrar";
}
document.getElementById("accountBtn").onclick = () => go(user ? "account" : "login");
updateAccountBtn();
if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    user = session ? session.user : null;
    updateAccountBtn();
    if (event === "SIGNED_IN") {
      let next = null;
      try { next = sessionStorage.getItem("bandeja-after-login"); sessionStorage.removeItem("bandeja-after-login"); } catch (e) {}
      if (next) { setTimeout(() => go(next), 0); return; }
    }
    if (event !== "TOKEN_REFRESHED") setTimeout(() => render(false), 0);
  });
}
render();
loadListings();
</script>
